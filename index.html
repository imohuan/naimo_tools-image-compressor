<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>图片压缩工具</title>
  <script type="module" crossorigin src="./js/main.CBzvnBNf.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/main.DaBj403J.css">
</head>

<body class="w-full h-screen select-none overflow-hidden">
  <div id="app" class="w-full h-full bg-gradient-to-br from-blue-50 to-indigo-100">
    <div class="w-full h-full flex gap-2 p-2">

      <!-- 左侧：文件列表 -->
      <section class="flex-1 flex flex-col bg-white rounded-lg shadow overflow-hidden">
        <!-- 上传区域 -->
        <div id="uploadArea"
          class="border-2 border-dashed border-blue-300 rounded-lg m-2 p-4 flex flex-col items-center justify-center gap-2 hover:border-blue-500 hover:bg-blue-50 transition-all cursor-pointer">
          <svg class="w-12 h-12 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
          </svg>
          <p class="text-sm font-medium text-gray-700">拖拽图片 / Ctrl+V 粘贴</p>
          <div class="flex gap-1">
            <button id="selectFiles"
              class="px-2 py-1 bg-blue-500 text-white rounded text-xs hover:bg-blue-600 transition-colors">选择文件</button>
            <button id="selectFolder"
              class="px-2 py-1 bg-indigo-500 text-white rounded text-xs hover:bg-indigo-600 transition-colors">选择文件夹</button>
            <button id="pasteBtn"
              class="px-2 py-1 bg-green-500 text-white rounded text-xs hover:bg-green-600 transition-colors">📋
              粘贴</button>
          </div>
        </div>

        <!-- 文件列表 -->
        <div id="fileList" class="flex-1 overflow-auto px-2 pb-2"></div>
      </section>

      <!-- 右侧：压缩设置 -->
      <section class="w-80 flex flex-col gap-2 overflow-auto pr-2 pb-2">

        <!-- 压缩选项 -->
        <div class="bg-white rounded-lg shadow p-3 flex-shrink-0">
          <div class="space-y-2">
            <!-- 压缩质量 -->
            <div>
              <div class="flex items-center justify-between mb-1">
                <label class="text-xs font-medium text-gray-600">压缩质量</label>
                <span id="qualityValue" class="text-xs font-semibold text-blue-600">80</span>
              </div>
              <input type="range" id="quality" min="1" max="100" value="80" class="w-full">
            </div>

            <!-- 输出格式 -->
            <div>
              <label class="block text-xs font-medium text-gray-600 mb-1">输出格式</label>
              <select id="format"
                class="w-full px-2 py-1 text-sm border border-gray-300 rounded focus:ring-1 focus:ring-blue-500 focus:border-transparent">
                <option value="original">保持原格式</option>
                <option value="jpeg">JPEG</option>
                <option value="png">PNG</option>
                <option value="webp">WebP</option>
              </select>
              <p class="text-xs text-gray-500 mt-1">💡 使用高效压缩算法，PNG 会自动转为 JPEG 以获得更好压缩率</p>
            </div>

            <!-- 目标大小 -->
            <div>
              <label class="block text-xs font-medium text-gray-600 mb-1">目标大小 (KB)</label>
              <input type="number" id="targetSize" placeholder="不限制"
                class="w-full px-2 py-1 text-sm border border-gray-300 rounded focus:ring-1 focus:ring-blue-500 focus:border-transparent">
            </div>

            <!-- 输出目录 -->
            <div>
              <label class="block text-xs font-medium text-gray-600 mb-1">输出目录</label>
              <div class="flex gap-1">
                <input type="text" id="outputDir" readonly placeholder="默认为下载目录"
                  class="flex-1 px-2 py-1 text-sm border border-gray-300 rounded bg-gray-50 text-gray-700">
                <button id="selectOutputDirBtn"
                  class="px-3 py-1 bg-gray-600 text-white rounded text-sm hover:bg-gray-700 transition-colors">
                  📁
                </button>
              </div>
            </div>
          </div>

          <!-- 操作按钮 -->
          <div class="flex gap-1 mt-3">
            <button id="compressBtn"
              class="flex-1 px-3 py-2 bg-gradient-to-r from-blue-500 to-indigo-600 text-white rounded text-sm font-semibold hover:from-blue-600 hover:to-indigo-700 transition-all disabled:opacity-50 disabled:cursor-not-allowed">
              🚀 开始压缩
            </button>
            <button id="clearBtn"
              class="px-3 py-2 bg-gray-500 text-white rounded text-sm font-semibold hover:bg-gray-600 transition-colors">
              🧹
            </button>
          </div>
        </div>

        <!-- 压缩统计 -->
        <div class="bg-white rounded-lg shadow p-3 flex-shrink-0">
          <h3 class="text-sm font-semibold text-gray-700 mb-2">📊 统计</h3>
          <div id="stats" class="space-y-1.5 text-xs">
            <div class="flex justify-between">
              <span class="text-gray-600">总文件数：</span>
              <span class="font-semibold" id="totalFiles">0</span>
            </div>
            <div class="flex justify-between">
              <span class="text-gray-600">已压缩：</span>
              <span class="font-semibold text-green-600" id="compressedFiles">0</span>
            </div>
            <div class="flex justify-between">
              <span class="text-gray-600">原始大小：</span>
              <span class="font-semibold" id="originalSize">0 B</span>
            </div>
            <div class="flex justify-between">
              <span class="text-gray-600">压缩后：</span>
              <span class="font-semibold text-blue-600" id="compressedSize">0 B</span>
            </div>
            <div class="flex justify-between">
              <span class="text-gray-600">节省空间：</span>
              <span class="font-semibold text-green-600" id="savedSize">0 B (0%)</span>
            </div>
          </div>

          <!-- 进度条 -->
          <div class="mt-3">
            <div class="w-full bg-gray-200 rounded-full h-1.5">
              <div id="progressBar"
                class="bg-gradient-to-r from-blue-500 to-indigo-600 h-1.5 rounded-full transition-all"
                style="width: 0%"></div>
            </div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <!-- 通知容器 -->
  <div id="notificationContainer" class="fixed top-4 right-4 z-50 space-y-2"></div>

  <!-- TypeScript 入口文件 -->
</body>

</html>
